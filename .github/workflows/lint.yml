# Название workflow — отображается во вкладке Actions на GitHub
name: Lint docs

# Когда запускать: на каждый Pull Request, нацеленный в main.
# Именно pull_request (а не push), потому что цель — проверить PR ДО мержа, а не сайт после деплоя.
on:
  pull_request:
    branches: [main]

# Принцип минимальных прав: этому workflow нужно только читать код PR, ничего не пишет
# в репозиторий. Особенно важно для публичного репозитория — PR может прийти из чужого
# форка с произвольным кодом в шагах "run:", и без этого блока токен унаследовал бы
# права по умолчанию из настроек репозитория (которые могут быть шире, чем нужно)
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Скачивает код репозитория в раннер — без этого шага остальные шаги работают с пустой папкой
      - uses: actions/checkout@v4

      # Проверяет, что все ссылки в .md файлах (в т.ч. внешние) рабочие, а не ведут в 404
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress 'docs/**/*.md'

      # Проверяет орфографию русского текста (markdownlint орфографию не проверяет вообще).
      # Настройки и словарь исключений — в .yaspellerrc в корне репозитория
      - name: Check spelling
        run: |
          npm install -g yaspeller
          yaspeller docs/**/*.md Инструкция_для_подсъемок_MD_PlantUML.md Пошаговая_инструкция_Docs_as_Code.md

      # Проверяет синтаксис самих yaml-файлов проекта (конфиг MkDocs и Swagger-спека)
      - name: Lint YAML
        run: |
          pip install yamllint
          yamllint mkdocs.yml docs/backend/swagger.yaml
